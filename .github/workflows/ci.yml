name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit: a moved tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: go mod download && bun install --frozen-lockfile
      - name: Format, vet, tests, typecheck, lint
        run: make check
      - name: Known vulnerabilities in Go code
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Known vulnerabilities in web packages
        run: bun audit
